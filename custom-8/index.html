<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech News Feed | Jonathan Castro</title>
    <link rel="icon" type="image/x-icon" href="/assets/KarmakazifaviconICO.ico">
    <link rel="stylesheet" href="/navigation.css">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ANIMATED BACKGROUND -->
    <canvas id="techBg"></canvas>

    <!-- NAVIGATION PLACEHOLDER -->
    <div id="navigation"></div>

    <!-- MAIN LAYOUT -->
    <div class="news-app">

        <!-- LEFT ICON SIDEBAR -->
        <aside class="icon-sidebar">
            <div class="sidebar-brand">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10" stroke-dasharray="4 2"/>
                    <path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke-linecap="round"/>
                </svg>
            </div>
            <nav class="sidebar-icons">
                <button class="icon-btn active" data-category="ai" title="AI News">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a4 4 0 0 1 4 4v2a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4z"/>
                        <path d="M8 14h8"/>
                        <path d="M6 10v4a6 6 0 0 0 12 0v-4"/>
                        <circle cx="9" cy="6.5" r="0.8" fill="currentColor"/>
                        <circle cx="15" cy="6.5" r="0.8" fill="currentColor"/>
                        <path d="M10 22h4"/>
                        <path d="M12 18v4"/>
                    </svg>
                    <span class="icon-label">AI</span>
                    <span class="icon-indicator"></span>
                </button>

                <button class="icon-btn" data-category="cybersecurity" title="Cybersecurity News">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2l8 4v6c0 5.25-3.5 9.74-8 11-4.5-1.26-8-5.75-8-11V6l8-4z"/>
                        <path d="M12 8v4"/>
                        <circle cx="12" cy="15" r="0.8" fill="currentColor"/>
                    </svg>
                    <span class="icon-label">Cyber</span>
                    <span class="icon-indicator"></span>
                </button>

                <button class="icon-btn" data-category="microsoft" title="Microsoft News">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="3" width="8" height="8" rx="1"/>
                        <rect x="13" y="3" width="8" height="8" rx="1"/>
                        <rect x="3" y="13" width="8" height="8" rx="1"/>
                        <rect x="13" y="13" width="8" height="8" rx="1"/>
                    </svg>
                    <span class="icon-label">MSFT</span>
                    <span class="icon-indicator"></span>
                </button>

                <button class="icon-btn" data-category="it" title="IT News">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="3" width="20" height="14" rx="2"/>
                        <path d="M8 21h8"/>
                        <path d="M12 17v4"/>
                        <path d="M7 8l3 3-3 3"/>
                        <path d="M13 14h4"/>
                    </svg>
                    <span class="icon-label">IT</span>
                    <span class="icon-indicator"></span>
                </button>
            </nav>
            <div class="sidebar-bottom">
                <button class="icon-btn refresh-btn" id="refreshAll" title="Refresh Feeds">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 4v6h6"/>
                        <path d="M23 20v-6h-6"/>
                        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 0 1 3.51 15"/>
                    </svg>
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="news-main">

            <!-- TOP HEADER BAR -->
            <header class="news-header">
                <div class="header-left">
                    <h1 class="header-title" id="categoryTitle">
                        <span class="title-icon" id="titleIcon">◈</span>
                        Artificial Intelligence
                    </h1>
                    <span class="header-subtitle" id="categorySubtitle">Latest AI developments, research & industry news</span>
                </div>
                <div class="header-right">
                    <div class="live-pulse">
                        <span class="pulse-dot"></span>
                        <span class="pulse-text">LIVE FEED</span>
                    </div>
                    <span class="last-updated" id="lastUpdated">Updated just now</span>
                </div>
            </header>

            <!-- LOADING STATE -->
            <div class="loading-state" id="loadingState">
                <div class="loading-grid">
                    <div class="loading-scanner">
                        <div class="scanner-line"></div>
                    </div>
                    <span class="loading-text">Scanning feeds...</span>
                </div>
            </div>

            <!-- NEWS SECTIONS CONTAINER -->
            <div class="news-sections" id="newsSections">
                <!-- Sections will be dynamically injected here -->
            </div>

            <!-- ERROR STATE -->
            <div class="error-state" id="errorState" style="display:none;">
                <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 8v4M12 16h.01"/>
                </svg>
                <p>Unable to load news feed. Please try again.</p>
                <button class="retry-btn" onclick="loadCategory(currentCategory)">Retry</button>
            </div>

        </main>
    </div>

    <script src="/navigation.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
